name: CD - Deploy to Production
# Force workflow cache refresh

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      commit_sha:
        description: 'Commit SHA being deployed'
        required: false
        type: string
      commit_author:
        description: 'Original commit author'
        required: false
        type: string
      source_branch:
        description: 'Source branch that was promoted'
        required: false
        type: string
      promoted_at:
        description: 'Timestamp when promotion occurred'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.validate.outputs.is_valid }}
    
    steps:
      - name: Validate branch
        id: validate
        run: |
          echo "Validating deployment request..."
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Source Branch: ${{ inputs.source_branch || 'N/A' }}"
          
          # Requirement 10.4: Verify branch matches Release_Branch
          if [ "${{ github.ref_name }}" != "release" ]; then
            echo "❌ Deployment rejected: Not from release branch"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # For workflow_dispatch, verify source branch if provided
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.source_branch }}" ]; then
            if [ "${{ inputs.source_branch }}" != "Development" ]; then
              echo "⚠️ Warning: Source branch is not Development"
            fi
          fi
          
          echo "✅ Deployment validation passed"
          echo "is_valid=true" >> $GITHUB_OUTPUT
      
      - name: Log deployment request
        run: |
          # Requirement 10.5: Log all deployment requests
          echo "## Deployment Request Log"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Event Type: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual Trigger: Yes"
            echo "Environment: ${{ inputs.environment }}"
          else
            echo "Automatic Trigger: Yes (push to release)"
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.is_valid == 'true'
    environment: production
    
    steps:
      - name: Display deployment information
        run: |
          echo "## 🚀 Deployment Information"
          echo ""
          echo "**Environment:** ${{ inputs.environment || 'production' }}"
          echo "**Trigger:** ${{ github.event_name }}"
          echo "**Branch:** ${{ github.ref_name }}"
          echo "**Current Commit:** ${{ github.sha }}"
          
          if [ -n "${{ inputs.commit_sha }}" ]; then
            echo ""
            echo "### Promotion Details"
            echo "**Promoted Commit:** ${{ inputs.commit_sha }}"
            echo "**Original Author:** ${{ inputs.commit_author }}"
            echo "**Source Branch:** ${{ inputs.source_branch }}"
            echo "**Promoted At:** ${{ inputs.promoted_at }}"
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Setup deployment scripts
        run: |
          chmod +x deployment/scripts/*.sh
          echo "Deployment scripts ready"
      
      - name: Resolve VPS IP address
        id: dns
        run: |
          IP=$(bash deployment/scripts/resolve-dns.sh "${{ secrets.VPS_HOSTNAME }}")
          echo "vps_ip=$IP" >> $GITHUB_OUTPUT
          echo "Resolved VPS IP: $IP"
        env:
          VPS_HOSTNAME: ${{ secrets.VPS_HOSTNAME }}
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # Write SSH key preserving newlines (use printf instead of echo)
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the key format
          if ! ssh-keygen -l -f ~/.ssh/deploy_key &>/dev/null; then
            echo "❌ Error: Invalid SSH key format in VPS_SSH_KEY secret"
            echo "The key must include:"
            echo "  - BEGIN PRIVATE KEY header"
            echo "  - Key data"
            echo "  - END PRIVATE KEY footer"
            echo ""
            echo "Please update the VPS_SSH_KEY secret with the complete private key"
            exit 1
          fi
          echo "✅ SSH key validated successfully"
          ssh-keyscan -H ${{ steps.dns.outputs.vps_ip }} >> ~/.ssh/known_hosts
      
      - name: Initialize VPS deployment directory
        run: |
          echo "🔧 Initializing VPS deployment directory..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'ENDSSH'
          set -e
          
          DEPLOY_DIR="/var/www/tzbot"
          
          echo "� Checking deployment directory..."
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          
          # Check if it's a git repository
          if [ -d .git ]; then
            echo "✅ Git repository exists, updating..."
            git fetch origin release
            git reset --hard origin/release
          else
            # Directory exists but no git - backup and reinitialize
            if [ "$(ls -A 2>/dev/null)" ]; then
              echo "⚠️  Non-git files found, backing up..."
              BACKUP_DIR="/tmp/tzbot_backup_$(date +%Y%m%d_%H%M%S)"
              mkdir -p "$BACKUP_DIR"
              cp -r . "$BACKUP_DIR/" 2>/dev/null || true
              rm -rf * .* 2>/dev/null || true
              echo "✅ Backup at: $BACKUP_DIR"
            fi
            
            echo "📦 Cloning repository..."
            git clone --branch release https://github.com/${{ github.repository }}.git .
            echo "✅ Repository cloned"
          fi
          
          # Make scripts executable
          chmod +x deployment/scripts/*.sh || true
          ENDSSH
      
      - name: Send deployment start notification
        run: |
          bash deployment/scripts/notify.sh start \
            "🚀 New Release v${{ steps.version.outputs.version }} - Deployment Starting" \
            "**Version:** \`v${{ steps.version.outputs.version }}\`\n**Commit:** \`${GITHUB_SHA:0:7}\`\n**Branch:** \`${{ github.ref_name }}\`\n**Author:** ${{ github.actor }}\n**Estimated Time:** ~2-3 minutes\n\n⏳ Installing dependencies and building..."
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        continue-on-error: true
      
      - name: Record deployment start
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "DEPLOY_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" < deployment/scripts/deployment-state.sh record-start \
            "${{ github.sha }}" "$TIMESTAMP" "${{ github.actor }}"
        env:
          APP_NAME: tzbot
          DEPLOY_BASE: /var/www/tzbot
      
      - name: Setup environment variables on VPS
        run: |
          echo "🔧 Setting up environment variables..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << EOF
          set -e
          ENV_FILE="/var/www/tzbot/shared/.env"

          mkdir -p /var/www/tzbot/shared
          : > "$ENV_FILE"

          append_if_set() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
            else
              echo "Skipping $key: secret not set"
            fi
          }

          echo "# Discord Configuration" >> "$ENV_FILE"
          append_if_set "DISCORD_TOKEN" '${{ secrets.DISCORD_TOKEN }}'
          append_if_set "DISCORD_CLIENT_ID" '${{ secrets.DISCORD_CLIENT_ID }}'
          append_if_set "DISCORD_GUILD_ID" '${{ secrets.DISCORD_GUILD_ID }}'
          echo "" >> "$ENV_FILE"

          echo "# Database Configuration" >> "$ENV_FILE"
          append_if_set "DATABASE_URL" '${{ secrets.DATABASE_URL }}'
          echo "" >> "$ENV_FILE"

          echo "# Redis Configuration (optional)" >> "$ENV_FILE"
          append_if_set "REDIS_URL" '${{ secrets.REDIS_URL }}'
          echo "" >> "$ENV_FILE"

          echo "# Notification Channels" >> "$ENV_FILE"
          append_if_set "NOTIFICATION_CHANNEL_ID" '${{ secrets.NOTIFICATION_CHANNEL_ID }}'
          append_if_set "FALLBACK_CHANNEL_ID" '${{ secrets.FALLBACK_CHANNEL_ID }}'
          echo "" >> "$ENV_FILE"

          echo "# Moderator Role" >> "$ENV_FILE"
          append_if_set "MODERATOR_ROLE_ID" '${{ secrets.MODERATOR_ROLE_ID }}'
          echo "" >> "$ENV_FILE"

          echo "# Kick Integration (optional)" >> "$ENV_FILE"
          append_if_set "KICK_CHANNEL_ID" '${{ secrets.KICK_CHANNEL_ID }}'
          append_if_set "KICK_WEBHOOK_SECRET" '${{ secrets.KICK_WEBHOOK_SECRET }}'
          echo "" >> "$ENV_FILE"

          echo "# Environment" >> "$ENV_FILE"
          printf '%s=%s\n' "NODE_ENV" "production" >> "$ENV_FILE"
          printf '%s=%s\n' "LOG_LEVEL" "info" >> "$ENV_FILE"

          chmod 600 "$ENV_FILE"
          echo "✅ Environment file created at $ENV_FILE"
          EOF

      - name: Execute deployment on VPS
        id: deploy
        run: |
          # Send progress update
          bash deployment/scripts/notify.sh info \
            "⚙️ Deployment In Progress" \
            "**Step:** Installing dependencies & building\n**Progress:** 🔵🔵⚪⚪⚪ 40%\n\n⏳ Please wait..."
          
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export APP_NAME=tzbot && \
             export DEPLOY_BASE=/var/www/tzbot && \
             export REPO_URL=${{ github.server_url }}/${{ github.repository }}.git && \
             export BRANCH=release && \
             bash /var/www/tzbot/deployment/scripts/deploy.sh ${{ github.sha }} ${{ env.DEPLOY_TIMESTAMP }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      - name: Restart application service
        run: |
          # Send progress update
          bash deployment/scripts/notify.sh info \
            "🔄 Restarting Bot Service" \
            "**Step:** Restarting PM2 service\n**Progress:** 🔵🔵🔵🔵⚪ 80%\n\n⏳ Almost done..."
          
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export SERVICE_NAME=tzbot && \
             export SERVICE_TYPE=pm2 && \
             export DEPLOY_BASE=/var/www/tzbot && \
             bash /var/www/tzbot/deployment/scripts/service-manager.sh restart"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      - name: Run health checks
        id: health
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export SERVICE_NAME=tzbot && \
             export SERVICE_TYPE=pm2 && \
             export DEPLOY_BASE=/var/www/tzbot && \
             bash /var/www/tzbot/deployment/scripts/health-check.sh"
      
      - name: Record deployment success
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" < deployment/scripts/deployment-state.sh record-complete \
            "${{ github.sha }}" "success" "Deployment completed successfully"
        env:
          APP_NAME: tzbot
          DEPLOY_BASE: /var/www/tzbot
      
      - name: Send success notification
        if: success()
        run: |
          bash deployment/scripts/notify.sh success \
            "✅ v${{ steps.version.outputs.version }} Deployed Successfully" \
            "**Version:** \`v${{ steps.version.outputs.version }}\`\n**Commit:** \`${GITHUB_SHA:0:7}\`\n**Branch:** \`${{ github.ref_name }}\`\n**Deployed by:** ${{ github.actor }}\n**Status:** 🟢 Working Normally\n\n✨ All systems operational!"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        continue-on-error: true
      
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Health checks failed, initiating rollback..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export APP_NAME=tzbot && \
             export DEPLOY_BASE=/var/www/tzbot && \
             export SERVICE_NAME=tzbot && \
             bash /var/www/tzbot/deployment/scripts/rollback.sh previous"
      
      - name: Record deployment failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" < deployment/scripts/deployment-state.sh record-complete \
            "${{ github.sha }}" "failed" "Deployment failed - see logs for details"
        env:
          APP_NAME: tzbot
          DEPLOY_BASE: /var/www/tzbot
        continue-on-error: true
      
      - name: Send failure notification
        if: failure()
        run: |
          bash deployment/scripts/notify.sh failure \
            "❌ Deployment Failed - Auto-Rollback Initiated" \
            "**Commit:** \`${GITHUB_SHA:0:7}\`\n**Branch:** \`${{ github.ref_name }}\`\n**Status:** 🔴 Rolling back to previous version\n\n🔄 Previous stable version restored"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        continue-on-error: true
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

