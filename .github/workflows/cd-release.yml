name: CD - Deploy to Production

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      commit_sha:
        description: 'Commit SHA being deployed'
        required: false
        type: string
      commit_author:
        description: 'Original commit author'
        required: false
        type: string
      source_branch:
        description: 'Source branch that was promoted'
        required: false
        type: string
      promoted_at:
        description: 'Timestamp when promotion occurred'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Display deployment information
        run: |
          echo "## 🚀 Deployment Information"
          echo ""
          echo "**Environment:** ${{ inputs.environment || 'production' }}"
          echo "**Trigger:** ${{ github.event_name }}"
          echo "**Branch:** ${{ github.ref_name }}"
          echo "**Current Commit:** ${{ github.sha }}"
          
          if [ -n "${{ inputs.commit_sha }}" ]; then
            echo ""
            echo "### Promotion Details"
            echo "**Promoted Commit:** ${{ inputs.commit_sha }}"
            echo "**Original Author:** ${{ inputs.commit_author }}"
            echo "**Source Branch:** ${{ inputs.source_branch }}"
            echo "**Promoted At:** ${{ inputs.promoted_at }}"
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup deployment scripts
        run: |
          chmod +x deployment/scripts/*.sh
          echo "Deployment scripts ready"
      
      - name: Resolve VPS IP address
        id: dns
        run: |
          IP=$(bash deployment/scripts/resolve-dns.sh "${{ secrets.VPS_HOSTNAME }}")
          echo "vps_ip=$IP" >> $GITHUB_OUTPUT
          echo "Resolved VPS IP: $IP"
        env:
          VPS_HOSTNAME: ${{ secrets.VPS_HOSTNAME }}
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.dns.outputs.vps_ip }} >> ~/.ssh/known_hosts
      
      - name: Send deployment start notification
        run: |
          bash deployment/scripts/notify.sh start \
            "Deploying commit ${{ github.sha }} to production" \
            "Branch: ${{ github.ref_name }}\nTriggered by: ${{ github.actor }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
      
      - name: Record deployment start
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "DEPLOY_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" < deployment/scripts/deployment-state.sh record-start \
            "${{ github.sha }}" "$TIMESTAMP" "${{ github.actor }}"
        env:
          APP_NAME: tzbot
          DEPLOY_BASE: /var/www/tzbot
      
      - name: Execute deployment on VPS
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export APP_NAME=tzbot && \
             export DEPLOY_BASE=/var/www/tzbot && \
             export REPO_URL=${{ github.server_url }}/${{ github.repository }}.git && \
             export BRANCH=release && \
             bash /var/www/tzbot/deployment/scripts/deploy.sh ${{ github.sha }} ${{ env.DEPLOY_TIMESTAMP }}"
      
      - name: Restart application service
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export SERVICE_NAME=tzbot && \
             export SERVICE_TYPE=pm2 && \
             bash /var/www/tzbot/deployment/scripts/service-manager.sh restart"
      
      - name: Run health checks
        id: health
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export SERVICE_NAME=tzbot && \
             export SERVICE_TYPE=pm2 && \
             bash /var/www/tzbot/deployment/scripts/health-check.sh"
      
      - name: Record deployment success
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" < deployment/scripts/deployment-state.sh record-complete \
            "${{ github.sha }}" "success" "Deployment completed successfully"
        env:
          APP_NAME: tzbot
          DEPLOY_BASE: /var/www/tzbot
      
      - name: Send success notification
        if: success()
        run: |
          bash deployment/scripts/notify.sh success \
            "Deployment successful!" \
            "Commit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nDeployed by: ${{ github.actor }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
      
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Health checks failed, initiating rollback..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "export APP_NAME=tzbot && \
             export DEPLOY_BASE=/var/www/tzbot && \
             export SERVICE_NAME=tzbot && \
             bash /var/www/tzbot/deployment/scripts/rollback.sh previous"
      
      - name: Record deployment failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" < deployment/scripts/deployment-state.sh record-complete \
            "${{ github.sha }}" "failed" "Deployment failed - see logs for details"
        env:
          APP_NAME: tzbot
          DEPLOY_BASE: /var/www/tzbot
        continue-on-error: true
      
      - name: Send failure notification
        if: failure()
        run: |
          bash deployment/scripts/notify.sh failure \
            "Deployment failed!" \
            "Commit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nCheck logs for details"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
