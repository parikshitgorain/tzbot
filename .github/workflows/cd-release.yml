name: CD - Deploy to Production

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run production tests
        run: npm run test:unit
        env:
          NODE_ENV: production
      
      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r dist deployment/
          cp package.json deployment/
          cp package-lock.json deployment/
          cp -r src/core/database/schema deployment/
          cd deployment
          tar -czf ../deployment.tar.gz .
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment
          path: deployment.tar.gz
          retention-days: 30
      
      # Add your deployment steps here based on your hosting provider
      # Examples below for common platforms:
      
      # For Railway:
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: tzbot-discord-bot
      
      # For Heroku:
      # - name: Deploy to Heroku
      #   uses: akhileshns/heroku-deploy@v3.13.15
      #   with:
      #     heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
      #     heroku_app_name: tzbot-discord-bot
      #     heroku_email: ${{ secrets.HEROKU_EMAIL }}
      
      # For AWS EC2/ECS:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      
      # - name: Deploy to AWS
      #   run: |
      #     # Your AWS deployment commands here
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: deployment.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Deployment to production successful!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
      
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
          echo "Please check the logs for details"

  post-deploy-verification:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment
        run: sleep 30
      
      - name: Health check
        run: |
          echo "Running post-deployment health checks..."
          # Add your health check endpoints here
          # curl -f https://your-bot-api.com/health || exit 1
      
      - name: Verify deployment
        run: echo "✅ Deployment verified successfully"
