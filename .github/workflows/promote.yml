name: Promote to Release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch'
        required: true
        default: 'Development'
      target_branch:
        description: 'Target branch'
        required: true
        default: 'release'
      commit_sha:
        description: 'Commit SHA'
        required: true
      commit_author:
        description: 'Commit author'
        required: true

permissions:
  contents: write

jobs:
  promote:
    name: Promote to Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Validate branches
        run: |
          if [ "${{ inputs.source_branch }}" = "${{ inputs.target_branch }}" ]; then
            echo "❌ Source and target branches cannot be the same"
            exit 1
          fi
          echo "✅ Branch validation passed"
      
      - name: Checkout target branch
        run: |
          git checkout ${{ inputs.target_branch }}
          git pull origin ${{ inputs.target_branch }}
      
      - name: Merge source branch
        run: |
          echo "Merging ${{ inputs.source_branch }} into ${{ inputs.target_branch }}"
          git merge --no-ff ${{ inputs.source_branch }} \
            -m "Merge ${{ inputs.source_branch }} into ${{ inputs.target_branch }}" \
            -m "Promoted commit: ${{ inputs.commit_sha }}" \
            -m "Author: ${{ inputs.commit_author }}"
      
      - name: Clean version for release
        if: inputs.target_branch == 'release'
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Strip -dev.X suffix if present
          CLEAN_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-dev\..*//')
          
          if [ "$CURRENT_VERSION" != "$CLEAN_VERSION" ]; then
            echo "Cleaning version: $CURRENT_VERSION → $CLEAN_VERSION"
            npm version $CLEAN_VERSION --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: clean version to $CLEAN_VERSION for release [skip ci]"
          else
            echo "Version already clean: $CLEAN_VERSION"
          fi
      
      - name: Remove dev-only files
        if: inputs.target_branch == 'release'
        run: |
          echo "Removing development-only files..."
          
          # Remove test directories
          rm -rf tests/ .kiro/specs/ .agents/ 2>/dev/null || true
          
          # Remove dev config files
          rm -f vitest.config.* tsconfig.test.json 2>/dev/null || true
          rm -f .eslintrc.* .prettierrc* eslint.config.js 2>/dev/null || true
          rm -f skills-lock.json 2>/dev/null || true
          
          # Remove test files
          find src -name "*.test.ts" -o -name "*.test.js" | xargs rm -f 2>/dev/null || true
          find src -name "*.example.ts" -o -name "*.example.js" | xargs rm -f 2>/dev/null || true
          
          # Remove dev scripts
          rm -f scripts/clear-commands.ts scripts/register-commands-to-guild.ts scripts/setup-test-db.ts 2>/dev/null || true
          
          # Stage deletions
          git add -A
          
          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove dev-only files from release [skip ci]"
            echo "✅ Dev files removed"
          else
            echo "✅ No dev files to remove"
          fi
      
      - name: Push to release branch
        run: |
          git push origin ${{ inputs.target_branch }}
          echo "✅ Pushed to ${{ inputs.target_branch }}"
      
      - name: Trigger deployment
        if: inputs.target_branch == 'release'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('🚀 Triggering deployment workflow...');
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-release.yml',
              ref: 'release',
              inputs: {
                environment: 'production',
                commit_sha: '${{ inputs.commit_sha }}',
                commit_author: '${{ inputs.commit_author }}',
                source_branch: '${{ inputs.source_branch }}'
              }
            });
            
            console.log('✅ Deployment workflow triggered');
      
      - name: Send notification
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"✅ Promoted to Release\",\"description\":\"**Version:** \`v$VERSION\`\\n**Commit:** \`${{ inputs.commit_sha }}\`\\n**Author:** ${{ inputs.commit_author }}\\n\\n🚀 Deployment triggered\",\"color\":3066993}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
        continue-on-error: true
