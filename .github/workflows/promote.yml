name: Branch Promotion

# Triggered by CI workflow success on Development branch
# Requirements: 2.1, 2.2, 2.3
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to promote from'
        required: true
        default: 'Development'
        type: string
      target_branch:
        description: 'Target branch to promote to'
        required: true
        default: 'release'
        type: string
      commit_sha:
        description: 'Commit SHA to promote'
        required: true
        type: string
      commit_author:
        description: 'Commit author'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  promote:
    name: Promote to Release Branch
    runs-on: ubuntu-latest
    
    steps:
      - name: Send promotion start notification
        run: |
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"🔄 Branch Promotion Started\",\"description\":\"**Source:** \`${{ inputs.source_branch }}\`\\n**Target:** \`${{ inputs.target_branch }}\`\\n**Commit:** \`${{ inputs.commit_sha }}\`\\n**Author:** ${{ inputs.commit_author }}\\n\\n⏳ Merging branches...\",\"color\":3447003}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for merge
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          # Configure git with GitHub Actions bot credentials
          # Requirement 2.2: Preserve commit authorship
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Verify source commit
        run: |
          echo "Verifying commit ${{ inputs.commit_sha }} exists on ${{ inputs.source_branch }}"
          git checkout ${{ inputs.source_branch }}
          if ! git cat-file -e ${{ inputs.commit_sha }}^{commit}; then
            echo "❌ Commit ${{ inputs.commit_sha }} not found"
            exit 1
          fi
          echo "✅ Commit verified"
      
      - name: Checkout target branch
        run: |
          git checkout ${{ inputs.target_branch }}
          git pull origin ${{ inputs.target_branch }}
      
      - name: Attempt merge
        id: merge
        run: |
          echo "Attempting to merge ${{ inputs.source_branch }} into ${{ inputs.target_branch }}"
          echo "Commit SHA: ${{ inputs.commit_sha }}"
          echo "Commit Author: ${{ inputs.commit_author }}"
          
          # Requirement 2.1: Merge changes to Release_Branch
          # Requirement 2.2: Use --no-ff to preserve commit history
          if git merge --no-ff ${{ inputs.source_branch }} -m "Merge ${{ inputs.source_branch }} into ${{ inputs.target_branch }} - Auto-promotion after successful CI" -m "Promoted commit: ${{ inputs.commit_sha }}" -m "Original author: ${{ inputs.commit_author }}"; then
            echo "✅ Merge successful"
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Merge conflicts detected - attempting auto-resolution"
            
            # Auto-resolve conflicts for dev-only files (prefer deletion in release)
            # These files should not exist in release branch
            git rm -rf tests/ .kiro/specs/ .agents/ || true
            git rm -f vitest.config.ts tsconfig.test.json .eslintrc.json .prettierrc eslint.config.js skills-lock.json || true
            git rm -f scripts/clear-commands.ts scripts/register-commands-to-guild.ts scripts/setup-test-db.ts || true
            find . -name "*.example.ts" -o -name "*.example.js" 2>/dev/null | xargs git rm -f || true
            
            # For production files with conflicts, prefer Development version
            git checkout --theirs -- src/ deployment/ docs/ .github/ package.json package-lock.json tsconfig.json README.md .gitignore .env.example || true
            
            # Add resolved files
            git add -A
            
            # Check if conflicts are resolved
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "❌ Unable to auto-resolve all conflicts"
              echo "merge_status=conflict" >> $GITHUB_OUTPUT
              git merge --abort
              exit 1
            else
              echo "✅ Conflicts auto-resolved"
              git commit --no-edit
              echo "merge_status=success" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Preserve commit history
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          # Requirement 2.2: Verify commit history and authorship preservation
          echo "Verifying commit history preservation..."
          
          # Check that the source commit is in the history (use git rev-list instead of grep)
          if git rev-list --all | grep -q "${{ inputs.commit_sha }}"; then
            echo "✅ Commit ${{ inputs.commit_sha }} found in history"
          else
            echo "⚠️ Warning: Commit ${{ inputs.commit_sha }} not found in history"
            exit 1
          fi
          
          # Verify authorship is preserved
          COMMIT_AUTHOR=$(git log --format='%an' ${{ inputs.commit_sha }} -1)
          echo "✅ Original commit author preserved: $COMMIT_AUTHOR"
          
          # Show merge commit details
          echo "Merge commit details:"
          git log -1 --pretty=format:"Commit: %H%nAuthor: %an <%ae>%nDate: %ad%nMessage: %s%n"
      
      - name: Clean dev-only files from release branch
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        run: |
          echo "🧹 Cleaning dev-only files from release branch..."
          
          # Remove test files and directories (physical removal to avoid git rm tracking issues)
          rm -rf tests/ .kiro/specs/ .agents/ 2>/dev/null || true
          
          # Remove dev config files
          rm -f vitest.config.ts vitest.config.js vitest.config.cjs \
            tsconfig.test.json \
            .eslintrc.json .eslintrc.js .eslintrc.cjs \
            .prettierrc .prettierrc.json .prettierrc.js \
            eslint.config.js eslint.config.mjs eslint.config.cjs \
            skills-lock.json 2>/dev/null || true
          
          # Remove dev scripts
          rm -f scripts/clear-commands.ts scripts/register-commands-to-guild.ts scripts/setup-test-db.ts 2>/dev/null || true
          
          # Remove example files
          find . -path ./node_modules -prune -o \( -name "*.example.ts" -o -name "*.example.js" \) -print0 2>/dev/null | xargs -0 rm -f 2>/dev/null || true
          
          # Stage all deletions (including files removed with rm that were git-tracked)
          git add -A
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "✅ No dev files to remove - branch already clean"
          else
            echo "📝 Committing cleanup changes..."
            git commit -m "chore: remove dev-only files from release branch [skip ci]"
            echo "✅ Dev files removed and committed"
          fi
      
      - name: Push to target branch
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          git push origin ${{ inputs.target_branch }}
          echo "✅ Successfully pushed to ${{ inputs.target_branch }}"
      
      - name: Send merge success notification
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"✅ Merge Successful\",\"description\":\"**Branch:** \`${{ inputs.target_branch }}\`\\n**Commit:** \`${{ inputs.commit_sha }}\`\\n\\n🔍 Verifying release branch...\",\"color\":3066993}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Verify release branch is clean
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        run: |
          echo "🔍 Verifying release branch contains no dev-only files..."
          
          # Check for test files
          if find . -path ./node_modules -prune -o -name "*.test.ts" -o -name "*.test.js" | grep -v node_modules | grep -q .; then
            echo "❌ ERROR: Test files found in release branch!"
            find . -path ./node_modules -prune -o -name "*.test.ts" -o -name "*.test.js" | grep -v node_modules
            exit 1
          fi
          
          # Check for dev directories
          if [ -d "tests" ] || [ -d ".kiro/specs" ] || [ -d ".agents" ]; then
            echo "❌ ERROR: Dev directories found in release branch!"
            ls -la tests/ .kiro/specs/ .agents/ 2>/dev/null || true
            exit 1
          fi
          
          # Check for dev config files
          if ls vitest.config.* tsconfig.test.* .eslintrc.* .prettierrc 2>/dev/null | grep -q .; then
          echo "❌ ERROR: Dev config files found in release branch!"
            ls -la vitest.config.* tsconfig.test.* .eslintrc.* .prettierrc 2>/dev/null || true
            exit 1
          fi
          
          # Check for example files
          if find . -path ./node_modules -prune -o -name "*.example.ts" -o -name "*.example.js" | grep -v node_modules | grep -q .; then
            echo "❌ ERROR: Example files found in release branch!"
            find . -path ./node_modules -prune -o -name "*.example.ts" -o -name "*.example.js" | grep -v node_modules
            exit 1
          fi
          
          echo "✅ Release branch is clean - no dev-only files found"
      
      - name: Send verification success notification
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        run: |
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"✅ Release Branch Verified\",\"description\":\"**Status:** Clean - no dev files\\n\\n🔢 Running semantic versioning...\",\"color\":3066993}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Setup Node.js for semantic-release
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Configure Git for semantic-release
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      
      - name: Install semantic-release dependencies
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        run: |
          echo "📦 Installing semantic-release and plugins..."
          npm install --no-save semantic-release @semantic-release/changelog @semantic-release/git conventional-changelog-conventionalcommits
          echo "✅ Dependencies installed"
      
      - name: Run semantic versioning
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          echo "🔢 Running semantic-release to auto-bump version..."
          echo ""
          
          # Get current version before semantic-release
          OLD_VERSION=$(node -p "require('./package.json').version")
          echo "📊 Current version: v$OLD_VERSION"
          echo "📍 Branch: $(git branch --show-current)"
          echo ""

          # If the current version is a dev pre-release (e.g. 1.0.0-dev.5), reset it to
          # the clean release version so semantic-release starts from a valid baseline.
          if echo "$OLD_VERSION" | grep -qE '\-dev\.'; then
            CLEAN_VERSION=$(echo "$OLD_VERSION" | sed 's/-dev\..*//')
            echo "🔄 Resetting pre-release version v$OLD_VERSION → v$CLEAN_VERSION for release channel"
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='$CLEAN_VERSION'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
            git add package.json
            git commit -m "chore: reset version to $CLEAN_VERSION for release [skip ci]" || true
            OLD_VERSION="$CLEAN_VERSION"
          fi

          # Check only release-channel tags (exclude dev pre-release tags like v1.0.0-dev.x)
          RELEASE_TAG_COUNT=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | wc -l)
          echo "📌 Existing tags: $(git tag | wc -l) total, $RELEASE_TAG_COUNT release-channel"
          
          if [ "$RELEASE_TAG_COUNT" -eq 0 ]; then
            # Use the clean (non-pre-release) version for the initial tag
            CLEAN_VERSION=$(echo "$OLD_VERSION" | sed 's/-.*$//')
            echo "⚠️  No release tags found - creating initial tag v$CLEAN_VERSION"
            git tag -a "v$CLEAN_VERSION" -m "Initial release v$CLEAN_VERSION" || true
            git push origin "v$CLEAN_VERSION" || true
          fi
          
          echo ""
          echo "📝 Recent commits since last tag:"
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "--all")..HEAD --oneline --no-decorate | head -10 || echo "No commits since last tag"
          echo ""
          
          # Run semantic-release with debug output
          echo "🚀 Running semantic-release..."
          npx semantic-release --debug 2>&1 | tee semantic-release.log || {
            echo "⚠️  Semantic-release completed with warnings"
          }
          
          # Get new version after semantic-release
          NEW_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "$OLD_VERSION")
          
          echo ""
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "✅ Version bumped: v$OLD_VERSION → v$NEW_VERSION"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  Version unchanged: v$OLD_VERSION"
            echo "💡 Tip: Use 'feat:', 'fix:', or 'BREAKING CHANGE:' in commit messages to trigger version bumps"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Send versioning success notification
        if: steps.merge.outputs.merge_status == 'success' && inputs.target_branch == 'release'
        run: |
          VERSION="${{ steps.semantic_release.outputs.version }}"
          OLD_VERSION="${{ steps.semantic_release.outputs.old_version }}"
          CHANGED="${{ steps.semantic_release.outputs.version_changed }}"
          
          if [ "$CHANGED" = "true" ]; then
            MESSAGE="**Version Bumped:** \`v$OLD_VERSION\` → \`v$VERSION\` ✨\n\n🚀 Triggering deployment..."
          else
            MESSAGE="**Version:** \`v$VERSION\` (unchanged)\n\n🚀 Triggering deployment..."
          fi
          
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"🔢 Version Updated\",\"description\":\"'"$MESSAGE"'\",\"color\":3066993}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Notify promotion failure
        if: failure() && steps.merge.outputs.merge_status != 'conflict'
        run: |
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"❌ Branch Promotion Failed\",\"description\":\"**Source:** \`${{ inputs.source_branch }}\`\\n**Target:** \`${{ inputs.target_branch }}\`\\n**Commit:** \`${{ inputs.commit_sha }}\`\\n\\n⚠️ Check workflow logs for details\",\"color\":15158332}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Notify merge conflict
        if: failure() && steps.merge.outputs.merge_status == 'conflict'
        run: |
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"❌ Branch Promotion Failed\",\"description\":\"**Reason:** Merge conflict detected\\n**Source:** \`${{ inputs.source_branch }}\`\\n**Target:** \`${{ inputs.target_branch }}\`\\n**Commit:** \`${{ inputs.commit_sha }}\`\\n\\n⚠️ Manual intervention required\",\"color\":15158332}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Create merge conflict issue
        if: failure() && steps.merge.outputs.merge_status == 'conflict'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Requirement 2.3: Notify developer of merge conflict
            const issue_body = `## ⚠️ Automatic Branch Promotion Failed
            
            **Reason:** Merge conflict detected
            
            **Details:**
            - Source Branch: \`${{ inputs.source_branch }}\`
            - Target Branch: \`${{ inputs.target_branch }}\`
            - Commit SHA: \`${{ inputs.commit_sha }}\`
            - Commit Author: @${{ inputs.commit_author }}
            
            **Action Required:**
            Please manually resolve the merge conflicts and merge \`${{ inputs.source_branch }}\` into \`${{ inputs.target_branch }}\`.
            
            **Steps to resolve:**
            1. \`git checkout ${{ inputs.target_branch }}\`
            2. \`git pull origin ${{ inputs.target_branch }}\`
            3. \`git merge ${{ inputs.source_branch }}\`
            4. Resolve conflicts in the affected files
            5. \`git add <resolved-files>\`
            6. \`git commit\`
            7. \`git push origin ${{ inputs.target_branch }}\`
            
            Once resolved, the deployment workflow will automatically trigger.
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Branch Promotion Failed - Merge Conflict',
              body: issue_body,
              labels: ['merge-conflict', 'ci/cd', 'needs-attention']
            });
            
            console.log('✅ Issue created to notify about merge conflict');
      
      - name: Trigger deployment workflow
        if: success()
        id: trigger_deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Requirement 2.4: Trigger deployment workflow on successful merge
            // Pass commit information to deployment workflow
            
            const commitInfo = {
              commit_sha: '${{ inputs.commit_sha }}',
              commit_author: '${{ inputs.commit_author }}',
              source_branch: '${{ inputs.source_branch }}',
              target_branch: '${{ inputs.target_branch }}',
              promoted_at: new Date().toISOString()
            };
            
            console.log('Triggering deployment workflow with commit information:');
            console.log(JSON.stringify(commitInfo, null, 2));
            
            // Trigger the deployment workflow
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-release.yml',
              ref: '${{ inputs.target_branch }}',
              inputs: {
                environment: 'production',
                commit_sha: commitInfo.commit_sha,
                commit_author: commitInfo.commit_author,
                source_branch: commitInfo.source_branch,
                promoted_at: commitInfo.promoted_at
              }
            });
            
            console.log('✅ Deployment workflow triggered successfully');
      
      - name: Send promotion complete notification
        if: success()
        run: |
          VERSION="${{ steps.semantic_release.outputs.version }}"
          bash -c 'curl -H "Content-Type: application/json" -X POST -d "{\"embeds\":[{\"title\":\"✅ Branch Promotion Complete\",\"description\":\"**Version:** \`v'"$VERSION"'\`\\n**Source:** \`${{ inputs.source_branch }}\`\\n**Target:** \`${{ inputs.target_branch }}\`\\n**Commit:** \`${{ inputs.commit_sha }}\`\\n**Author:** ${{ inputs.commit_author }}\\n\\n🚀 Deployment workflow triggered\",\"color\":3066993}]}" "${{ secrets.DISCORD_WEBHOOK_URL }}"' || true
        continue-on-error: true
      
      - name: Promotion summary
        if: success()
        run: |
          echo "## 🚀 Branch Promotion Successful"
          echo ""
          echo "**Source Branch:** ${{ inputs.source_branch }}"
          echo "**Target Branch:** ${{ inputs.target_branch }}"
          echo "**Commit SHA:** ${{ inputs.commit_sha }}"
          echo "**Commit Author:** ${{ inputs.commit_author }}"
          echo ""
          echo "The ${{ inputs.target_branch }} branch has been updated and deployment workflow has been triggered."
