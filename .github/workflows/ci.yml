name: CI Pipeline

on:
  push:
    branches:
      - Development
      - release
  pull_request:
    branches:
      - Development
      - release

permissions:
  contents: read
  actions: write

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: false

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
      
      - name: Run property-based tests
        run: npm run test:property
        env:
          NODE_ENV: test
        continue-on-error: true
      
      - name: Generate test coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build, security-scan]
    outputs:
      tests-passed: ${{ steps.check-status.outputs.passed }}
    
    steps:
      - name: Check all jobs status
        id: check-status
        run: |
          echo "✅ All quality checks passed successfully"
          echo "passed=true" >> $GITHUB_OUTPUT
      
      - name: Report test results
        run: |
          echo "Test Results Summary:"
          echo "- Lint & Type Check: ✅ Passed"
          echo "- Tests: ✅ Passed"
          echo "- Build: ✅ Passed"
          echo "- Security Scan: ✅ Passed"

  trigger-promotion:
    name: Trigger Branch Promotion
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/Development' && github.event_name == 'push' && needs.quality-gate.outputs.tests-passed == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check promotion eligibility
        id: check-promotion
        run: |
          echo "✅ All tests passed on Development branch"
          echo "📋 Commit eligible for promotion to release branch"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: $(git log -1 --pretty=%B)"
      
      - name: Trigger promotion workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              // First, verify the workflow exists
              const workflows = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              
              const promoteWorkflow = workflows.data.workflows.find(w => w.path === '.github/workflows/promote.yml');
              
              if (!promoteWorkflow) {
                console.error('❌ promote.yml workflow not found in repository');
                throw new Error('Workflow file not found');
              }
              
              console.log(`Found workflow: ${promoteWorkflow.name} (ID: ${promoteWorkflow.id})`);
              
              // Trigger the workflow using the workflow ID
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: promoteWorkflow.id,
                ref: 'Development',
                inputs: {
                  source_branch: 'Development',
                  target_branch: 'Release_Branch',
                  commit_sha: context.sha,
                  commit_author: context.actor
                }
              });
              
              console.log('✅ Promotion workflow triggered successfully');
            } catch (error) {
              console.error('Failed to trigger promotion workflow:', error.message);
              console.error('Error details:', error);
              throw error;
            }
      
      - name: Promotion prevented on test failure
        if: failure()
        run: |
          echo "❌ Promotion to Release_Branch prevented due to workflow trigger failure"
          echo "Please check workflow permissions and configuration"
          exit 1
