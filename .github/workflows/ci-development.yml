name: CI - Development Pipeline

on:
  push:
    branches:
      - Development
      - development
  pull_request:
    branches:
      - Development
      - development

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: CODE QUALITY
  # ============================================================================
  
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript type check
        run: npm run typecheck

  # ============================================================================
  # STAGE 2: SECURITY SCAN
  # ============================================================================
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit (production dependencies only)
        run: |
          echo "🔍 Scanning production dependencies for critical/high vulnerabilities..."
          npm audit --omit=dev --audit-level=high
      
      - name: Upload security results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: npm-audit.json
          retention-days: 30

  # ============================================================================
  # STAGE 3: TESTS
  # ============================================================================
  
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
      
      - name: Generate coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
        continue-on-error: true

  # ============================================================================
  # STAGE 4: BUILD
  # ============================================================================
  
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Verify build
        run: |
          [ -d "dist" ] || { echo "❌ dist/ not found"; exit 1; }
          [ -f "dist/index.js" ] || { echo "❌ entry point not found"; exit 1; }
          echo "✅ Build verified"

  # ============================================================================
  # STAGE 5: PREPARE CLEAN RELEASE
  # ============================================================================
  
  prepare-release:
    name: Prepare Clean Release
    runs-on: ubuntu-latest
    needs: [lint, security, test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Development' || github.ref == 'refs/heads/development')
    
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production bundle
        run: npm run build
      
      - name: Prepare clean release
        run: |
          chmod +x deployment/scripts/prepare_clean_release.sh
          deployment/scripts/prepare_clean_release.sh /tmp/clean-build
      
      - name: Create tarball
        run: |
          cd /tmp/clean-build
          tar -czf ../production-build-${{ github.sha }}.tar.gz .
          ls -lh /tmp/production-build-${{ github.sha }}.tar.gz
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-clean-build-${{ github.sha }}
          path: /tmp/production-build-${{ github.sha }}.tar.gz
          retention-days: 30
          compression-level: 0

  # ============================================================================
  # STAGE 6: AUTO-PROMOTE TO RELEASE
  # ============================================================================
  
  auto-promote:
    name: Auto-Promote to Release
    runs-on: ubuntu-latest
    needs: prepare-release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Development' || github.ref == 'refs/heads/development')
    environment: release-promotion
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Download clean build
        uses: actions/download-artifact@v4
        with:
          name: production-clean-build-${{ github.sha }}
          path: /tmp/
      
      - name: Extract clean build
        run: |
          mkdir -p /tmp/clean-build
          cd /tmp/clean-build
          tar -xzf /tmp/production-build-${{ github.sha }}.tar.gz
      
      - name: Promote to release branch
        run: |
          chmod +x deployment/scripts/promote_to_release.sh
          deployment/scripts/promote_to_release.sh /tmp/clean-build ${{ github.sha }}
      
      - name: Send Discord notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Promoted to Release"
            DESC="Clean build promoted successfully"
          else
            COLOR=15158332
            TITLE="❌ Promotion Failed"
            DESC="Failed to promote to release branch"
          fi
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"${TITLE}\",\"description\":\"${DESC}\",\"color\":${COLOR},\"fields\":[{\"name\":\"Commit\",\"value\":\"\`${GITHUB_SHA:0:7}\`\"},{\"name\":\"Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
        continue-on-error: true

  # ============================================================================
  # SUMMARY
  # ============================================================================
  
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, build, prepare-release, auto-promote]
    if: always()
    
    steps:
      - name: Send Discord notification
        run: |
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.security.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            STATUS="SUCCESS"
            COLOR=3066993
            EMOJI="✅"
          else
            STATUS="FAILED"
            COLOR=15158332
            EMOJI="❌"
          fi
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"${EMOJI} CI Pipeline ${STATUS}\",\"description\":\"Branch: development\",\"color\":${COLOR},\"fields\":[{\"name\":\"Commit\",\"value\":\"\`${GITHUB_SHA:0:7}\`\"},{\"name\":\"Author\",\"value\":\"${{ github.actor }}\"},{\"name\":\"Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
        continue-on-error: true
