name: CD - Production Deployment

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [deploy-release]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'
  DEPLOY_TIMEOUT: 600
  HEALTH_CHECK_TIMEOUT: 120
  
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STAGE 1: VALIDATE DEPLOYMENT
  # ============================================================================
  
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.validate.outputs.is_valid }}
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      
      - name: Validate source
        id: validate
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Ref: ${{ github.ref }}"
          
          # Allow repository_dispatch events (triggered by release-versioning)
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "✅ Triggered by repository_dispatch event"
            echo "is_valid=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For push events, validate it's from release branch or version tag
          if [[ "${{ github.ref }}" != "refs/heads/release" ]] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "❌ Not from release branch or version tag"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Validation passed"
          echo "is_valid=true" >> $GITHUB_OUTPUT
      
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Get short SHA
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
      
      - name: Verify production readiness
        run: |
          echo "🔍 Verifying production readiness..."
          
          [ -d "dist" ] || { echo "❌ Missing dist/"; exit 1; }
          [ -f "package.json" ] || { echo "❌ Missing package.json"; exit 1; }
          [ -f "ecosystem.config.cjs" ] || [ -f "ecosystem.config.js" ] || { echo "❌ Missing ecosystem config"; exit 1; }
          [ -d "deployment/scripts" ] || { echo "❌ Missing deployment/scripts"; exit 1; }
          
          if [ -d "tests/" ] || [ -f "vitest.config.ts" ] || [ -f "eslint.config.js" ]; then
            echo "❌ Dev artifacts in release branch!"
            exit 1
          fi
          
          TEST_FILES=$(find . -name "*.test.*" -o -name "*.spec.*" 2>/dev/null | wc -l)
          if [ "$TEST_FILES" -gt 0 ]; then
            echo "❌ Found $TEST_FILES test files!"
            exit 1
          fi
          
          echo "✅ Production ready"

  # ============================================================================
  # STAGE 2: CREATE DEPLOYMENT RECORD
  # ============================================================================
  
  create-deployment:
    name: Create Deployment Record
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.is_valid == 'true'
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    
    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          ref: ${{ github.ref }}
          description: "Deploying v${{ needs.validate.outputs.version }}"

  # ============================================================================
  # STAGE 3: DEPLOY TO VPS
  # ============================================================================
  
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [validate, create-deployment]
    environment: production
    timeout-minutes: 15
    
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Debug - List files
        run: |
          echo "📂 Current directory: $(pwd)"
          echo "📂 Listing root:"
          ls -la
          echo "📂 Checking deployment directory:"
          ls -la deployment/ || echo "❌ No deployment directory"
          echo "📂 Checking deployment/scripts:"
          ls -la deployment/scripts/ || echo "❌ No deployment/scripts directory"
      
      - name: Setup SSH
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ VPS_SSH_KEY secret is not set or empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.VPS_HOSTNAME }}" ]; then
            echo "❌ VPS_HOSTNAME secret is not set or empty"
            exit 1
          fi
          
          if [ ! -f deployment/scripts/setup_ssh.sh ]; then
            echo "❌ setup_ssh.sh not found!"
            exit 1
          fi
          
          chmod +x deployment/scripts/setup_ssh.sh
          deployment/scripts/setup_ssh.sh "${{ secrets.VPS_SSH_KEY }}" "${{ secrets.VPS_HOSTNAME }}"
      
      - name: Create deployment package
        run: |
          echo "📦 Creating deployment package..."
          
          # Create a staging directory
          mkdir -p /tmp/deploy-staging
          
          # Copy files to staging (excluding what we don't need)
          rsync -av --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='*.test.*' \
            --exclude='*.spec.*' \
            --exclude='coverage' \
            . /tmp/deploy-staging/
          
          # Create tar from staging directory
          cd /tmp/deploy-staging
          tar -czf /tmp/deployment-package.tar.gz .
          mv /tmp/deployment-package.tar.gz $GITHUB_WORKSPACE/
          
          echo "✅ Package created: $(du -h $GITHUB_WORKSPACE/deployment-package.tar.gz | cut -f1)"
      
      - name: Upload package to VPS
        timeout-minutes: 5
        run: |
          echo "📤 Uploading deployment package..."
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            -o ConnectTimeout=30 \
            deployment-package.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/deployment-package.tar.gz
          echo "✅ Package uploaded"
      
      - name: Update environment variables
        timeout-minutes: 2
        run: |
          echo "🔧 Updating environment variables on VPS..."
          
          # Create .env content from secrets
          cat > /tmp/.env << 'ENV_EOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          NODE_ENV=production
          ENV_EOF
          
          # Upload .env to VPS
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            /tmp/.env \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/.env.new
          
          # Create update script
          cat > /tmp/update-env.sh << 'SCRIPT_EOF'
          #!/bin/bash
          
          # Create shared directory if it doesn't exist
          mkdir -p /var/www/tzbot/shared/logs
          mkdir -p /var/www/tzbot/shared/data/state
          
          # Backup existing .env if it exists
          if [ -f "/var/www/tzbot/shared/.env" ]; then
            echo "📋 Backing up existing .env..."
            cp /var/www/tzbot/shared/.env /var/www/tzbot/shared/.env.backup.$(date +%Y%m%d_%H%M%S)
          fi
          
          # Move new .env to shared directory
          mv /tmp/.env.new /var/www/tzbot/shared/.env
          chmod 600 /var/www/tzbot/shared/.env
          
          echo "✅ Environment variables updated"
          SCRIPT_EOF
          
          # Upload and execute script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            /tmp/update-env.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/update-env.sh
          
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/update-env.sh && rm /tmp/update-env.sh"
          
          # Clean up local files
          rm -f /tmp/.env /tmp/update-env.sh
      
      - name: Verify VPS environment
        timeout-minutes: 2
        run: |
          echo "🔍 Verifying VPS environment..."
          
          # Create verification script
          cat > /tmp/verify-env.sh << 'SCRIPT_EOF'
          #!/bin/bash
          
          # Verify .env file exists
          if [ ! -f "/var/www/tzbot/shared/.env" ]; then
            echo "❌ ERROR: .env file not found after update!"
            exit 1
          fi
          
          echo "✅ .env file verified"
          
          # Check if required commands are available
          command -v node >/dev/null 2>&1 || { echo "❌ Node.js not installed"; exit 1; }
          command -v npm >/dev/null 2>&1 || { echo "❌ npm not installed"; exit 1; }
          command -v pm2 >/dev/null 2>&1 || { echo "❌ PM2 not installed"; exit 1; }
          command -v jq >/dev/null 2>&1 || { echo "❌ jq not installed"; exit 1; }
          
          echo "✅ All required commands available"
          echo "✅ VPS environment verified"
          SCRIPT_EOF
          
          # Upload and execute script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            /tmp/verify-env.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/verify-env.sh
          
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/verify-env.sh && rm /tmp/verify-env.sh"
          
          rm -f /tmp/verify-env.sh
      
      - name: Deploy on VPS
        timeout-minutes: 10
        run: |
          echo "🚀 Deploying application..."
          
          # Copy deployment script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            deployment/scripts/deploy_release.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/deploy_release.sh
          
          # Execute deployment and capture output
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/deploy_release.sh 2>&1 | tee /tmp/deploy.log && rm /tmp/deploy_release.sh" || {
              echo "❌ Deployment failed!"
              echo "📋 Fetching deployment logs..."
              ssh -i ~/.ssh/deploy_key \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o LogLevel=ERROR \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
                "cat /tmp/deploy.log 2>/dev/null || echo 'No deployment log found'"
              exit 1
            }
          
          echo "✅ Deployment completed"
      
      - name: Install/Update monitoring
        timeout-minutes: 2
        run: |
          echo "📊 Installing VPS monitoring..."
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            deployment/scripts/install-monitoring.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/install-monitoring.sh
          
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/install-monitoring.sh && rm /tmp/install-monitoring.sh"
        continue-on-error: true
      
      - name: Wait for startup
        run: |
          echo "⏳ Waiting for application startup..."
          sleep 30
      
      - name: Run health checks
        id: health
        timeout-minutes: 5
        run: |
          echo "🏥 Running health checks..."
          
          # Copy health check script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            deployment/scripts/health_check.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/health_check.sh
          
          # Run health checks with more attempts and longer initial delay
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/health_check.sh 10 10 && rm /tmp/health_check.sh"
      
      - name: Send test notification from VPS
        if: success()
        timeout-minutes: 2
        run: |
          echo "📨 Sending test notification from VPS to verify webhook..."
          
          # Create notification script
          cat > /tmp/send-notification.sh << 'SCRIPT_EOF'
          #!/bin/bash
          
          # Load environment variables
          if [ -f "/var/www/tzbot/shared/.env" ]; then
            export $(grep -v '^#' /var/www/tzbot/shared/.env | xargs)
          fi
          
          # Get deployment info
          CURRENT_RELEASE=$(readlink /var/www/tzbot/current 2>/dev/null | xargs basename || echo "unknown")
          VERSION=$(cat /var/www/tzbot/current/package.json 2>/dev/null | grep '"version"' | cut -d'"' -f4 || echo "unknown")
          HOSTNAME=$(hostname)
          
          # Send test notification
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"✅ VPS Webhook Test\",\"description\":\"Deployment successful! Webhook is working correctly.\",\"color\":3066993,\"fields\":[{\"name\":\"🖥️ Server\",\"value\":\"\`${HOSTNAME}\`\",\"inline\":true},{\"name\":\"📦 Version\",\"value\":\"\`v${VERSION}\`\",\"inline\":true},{\"name\":\"🔄 Release\",\"value\":\"\`${CURRENT_RELEASE}\`\",\"inline\":true},{\"name\":\"✅ Status\",\"value\":\"Application is running and webhook is operational\",\"inline\":false}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "${DISCORD_WEBHOOK_URL}" && echo "✅ Test notification sent from VPS" || echo "⚠️ Failed to send test notification"
          SCRIPT_EOF
          
          # Upload and execute script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            /tmp/send-notification.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/send-notification.sh
          
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/send-notification.sh && rm /tmp/send-notification.sh"
          
          rm -f /tmp/send-notification.sh
        continue-on-error: true
      
      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        id: rollback
        timeout-minutes: 5
        run: |
          echo "🔄 Health check failed, initiating rollback..."
          
          # Copy rollback script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            deployment/scripts/rollback.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/rollback.sh
          
          # Execute rollback and capture output
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/rollback.sh && rm /tmp/rollback.sh"
          
          # Get rollback version info
          ROLLBACK_VERSION=$(ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "cat /tmp/rollback_version.txt 2>/dev/null || echo 'unknown'")
          
          ROLLBACK_RELEASE=$(ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "cat /tmp/rollback_release.txt 2>/dev/null || echo 'unknown'")
          
          echo "✅ Rollback completed"
          echo "Rolled back to version: v$ROLLBACK_VERSION"
          echo "Rolled back to release: $ROLLBACK_RELEASE"
          
          # Send rollback notification with correct version info
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"🔄 Automatic Rollback\",\"description\":\"Health check failed, rolled back to previous release\",\"color\":15158332,\"fields\":[{\"name\":\"Failed Version\",\"value\":\"\`v${{ needs.validate.outputs.version }}\`\",\"inline\":true},{\"name\":\"Rolled Back To\",\"value\":\"\`v${ROLLBACK_VERSION}\`\",\"inline\":true},{\"name\":\"Failed Commit\",\"value\":\"\`${{ needs.validate.outputs.short_sha }}\`\",\"inline\":true},{\"name\":\"Release\",\"value\":\"\`${ROLLBACK_RELEASE}\`\",\"inline\":true},{\"name\":\"Reason\",\"value\":\"Health check failed after deployment\"}],\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
          
          exit 1
        continue-on-error: false
      
      - name: Update deployment status - Success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          state: 'success'
          environment-url: 'https://${{ secrets.VPS_HOSTNAME }}'
      
      - name: Update deployment status - Failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          state: 'failure'
      
      - name: Gather deployment report
        if: always()
        id: report
        run: |
          echo "📊 Gathering deployment report..."
          
          # Create a script to gather info on VPS
          cat > /tmp/gather-report.sh << 'SCRIPT_EOF'
          #!/bin/bash
          
          # Get current deployment info
          CURRENT_RELEASE=$(readlink /var/www/tzbot/current 2>/dev/null | xargs basename || echo "unknown")
          
          # Get PM2 status
          PM2_STATUS=$(pm2 jlist 2>/dev/null | jq -r '.[0].pm2_env.status' 2>/dev/null || echo "unknown")
          PM2_UPTIME=$(pm2 jlist 2>/dev/null | jq -r '.[0].pm2_env.pm_uptime' 2>/dev/null || echo "0")
          PM2_RESTARTS=$(pm2 jlist 2>/dev/null | jq -r '.[0].pm2_env.restart_time' 2>/dev/null || echo "0")
          
          # Calculate uptime
          if [ "$PM2_UPTIME" != "0" ] && [ "$PM2_UPTIME" != "null" ]; then
            CURRENT_TIME=$(date +%s)000
            UPTIME_MS=$((CURRENT_TIME - PM2_UPTIME))
            UPTIME_SECONDS=$((UPTIME_MS / 1000))
            UPTIME_MINUTES=$((UPTIME_SECONDS / 60))
            UPTIME_HOURS=$((UPTIME_MINUTES / 60))
            
            if [ $UPTIME_HOURS -gt 0 ]; then
              UPTIME="${UPTIME_HOURS}h $((UPTIME_MINUTES % 60))m"
            elif [ $UPTIME_MINUTES -gt 0 ]; then
              UPTIME="${UPTIME_MINUTES}m"
            else
              UPTIME="${UPTIME_SECONDS}s"
            fi
          else
            UPTIME="unknown"
          fi
          
          # Get disk usage
          DISK_USAGE=$(df -h /var/www/tzbot 2>/dev/null | awk 'NR==2 {print $5}' || echo "unknown")
          
          # Get memory usage
          MEMORY_USAGE=$(free -h 2>/dev/null | awk 'NR==2 {print $3 "/" $2}' || echo "unknown")
          
          # Get release count
          RELEASE_COUNT=$(ls -1 /var/www/tzbot/releases 2>/dev/null | wc -l || echo "0")
          
          # Output as compact JSON
          printf '{"current_release":"%s","pm2_status":"%s","pm2_uptime":"%s","pm2_restarts":"%s","disk_usage":"%s","memory_usage":"%s","release_count":"%s"}' \
            "$CURRENT_RELEASE" "$PM2_STATUS" "$UPTIME" "$PM2_RESTARTS" "$DISK_USAGE" "$MEMORY_USAGE" "$RELEASE_COUNT"
          SCRIPT_EOF
          
          # Upload and execute script
          scp -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            /tmp/gather-report.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }}:/tmp/gather-report.sh
          
          # Execute script and capture only JSON output
          DEPLOY_INFO=$(ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o LogLevel=ERROR \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOSTNAME }} \
            "bash /tmp/gather-report.sh 2>/dev/null && rm /tmp/gather-report.sh" 2>/dev/null) || \
            DEPLOY_INFO='{"current_release":"unknown","pm2_status":"unknown","pm2_uptime":"unknown","pm2_restarts":"0","disk_usage":"unknown","memory_usage":"unknown","release_count":"0"}'
          
          # Validate JSON
          if ! echo "$DEPLOY_INFO" | jq empty 2>/dev/null; then
            echo "⚠️ Invalid JSON received, using defaults"
            DEPLOY_INFO='{"current_release":"unknown","pm2_status":"unknown","pm2_uptime":"unknown","pm2_restarts":"0","disk_usage":"unknown","memory_usage":"unknown","release_count":"0"}'
          fi
          
          echo "Deployment info: $DEPLOY_INFO"
          
          echo "deploy_info<<EOF" >> $GITHUB_OUTPUT
          echo "$DEPLOY_INFO" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Send Discord notification - Deploy to VPS
        if: always()
        run: |
          # Parse deployment info
          DEPLOY_INFO='${{ steps.report.outputs.deploy_info }}'
          CURRENT_RELEASE=$(echo "$DEPLOY_INFO" | jq -r '.current_release // "unknown"')
          PM2_STATUS=$(echo "$DEPLOY_INFO" | jq -r '.pm2_status // "unknown"')
          PM2_UPTIME=$(echo "$DEPLOY_INFO" | jq -r '.pm2_uptime // "unknown"')
          PM2_RESTARTS=$(echo "$DEPLOY_INFO" | jq -r '.pm2_restarts // "0"')
          DISK_USAGE=$(echo "$DEPLOY_INFO" | jq -r '.disk_usage // "unknown"')
          MEMORY_USAGE=$(echo "$DEPLOY_INFO" | jq -r '.memory_usage // "unknown"')
          RELEASE_COUNT=$(echo "$DEPLOY_INFO" | jq -r '.release_count // "0"')
          
          # Determine if rollback occurred
          ROLLBACK_OCCURRED="false"
          if [ "${{ steps.rollback.outcome }}" = "failure" ]; then
            ROLLBACK_OCCURRED="true"
          fi
          
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="🚀 Deploy to VPS - Success"
            DESC="Version \`v${{ needs.validate.outputs.version }}\` successfully deployed to production VPS"
            
            FIELDS="[
              {\"name\":\"📦 Version\",\"value\":\"\`v${{ needs.validate.outputs.version }}\`\",\"inline\":true},
              {\"name\":\"📝 Commit\",\"value\":\"\`${{ needs.validate.outputs.short_sha }}\`\",\"inline\":true},
              {\"name\":\"🔄 Current Release\",\"value\":\"\`${CURRENT_RELEASE}\`\",\"inline\":true},
              {\"name\":\"✅ PM2 Status\",\"value\":\"\`${PM2_STATUS}\`\",\"inline\":true},
              {\"name\":\"⏱️ Uptime\",\"value\":\"\`${PM2_UPTIME}\`\",\"inline\":true},
              {\"name\":\"🔁 Restarts\",\"value\":\"\`${PM2_RESTARTS}\`\",\"inline\":true},
              {\"name\":\"💾 Disk Usage\",\"value\":\"\`${DISK_USAGE}\`\",\"inline\":true},
              {\"name\":\"🧠 Memory\",\"value\":\"\`${MEMORY_USAGE}\`\",\"inline\":true},
              {\"name\":\"📚 Total Releases\",\"value\":\"\`${RELEASE_COUNT}\`\",\"inline\":true},
              {\"name\":\"🔗 Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":false}
            ]"
          else
            COLOR=15158332
            TITLE="❌ Deploy to VPS - Failed"
            
            if [ "$ROLLBACK_OCCURRED" = "true" ]; then
              DESC="Version \`v${{ needs.validate.outputs.version }}\` failed to deploy. System automatically rolled back to previous version."
              FIELDS="[
                {\"name\":\"❌ Failed Version\",\"value\":\"\`v${{ needs.validate.outputs.version }}\`\",\"inline\":true},
                {\"name\":\"📝 Commit\",\"value\":\"\`${{ needs.validate.outputs.short_sha }}\`\",\"inline\":true},
                {\"name\":\"🔄 Current Release\",\"value\":\"\`${CURRENT_RELEASE}\`\",\"inline\":true},
                {\"name\":\"✅ PM2 Status\",\"value\":\"\`${PM2_STATUS}\`\",\"inline\":true},
                {\"name\":\"⏱️ Uptime\",\"value\":\"\`${PM2_UPTIME}\`\",\"inline\":true},
                {\"name\":\"🔁 Restarts\",\"value\":\"\`${PM2_RESTARTS}\`\",\"inline\":true},
                {\"name\":\"⚠️ Status\",\"value\":\"Rolled back to previous release\",\"inline\":false},
                {\"name\":\"🔗 Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":false}
              ]"
            else
              DESC="Version \`v${{ needs.validate.outputs.version }}\` failed to deploy to production VPS"
              FIELDS="[
                {\"name\":\"❌ Failed Version\",\"value\":\"\`v${{ needs.validate.outputs.version }}\`\",\"inline\":true},
                {\"name\":\"📝 Commit\",\"value\":\"\`${{ needs.validate.outputs.short_sha }}\`\",\"inline\":true},
                {\"name\":\"🔄 Current Release\",\"value\":\"\`${CURRENT_RELEASE}\`\",\"inline\":true},
                {\"name\":\"🔗 Workflow\",\"value\":\"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"inline\":false}
              ]"
            fi
          fi
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"${TITLE}\",\"description\":\"${DESC}\",\"color\":${COLOR},\"fields\":${FIELDS},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
        continue-on-error: true
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.sha }}
          path: |
            /tmp/*.log
            ~/.ssh/known_hosts
          retention-days: 7
        continue-on-error: true
