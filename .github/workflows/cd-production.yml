name: CD - Production Deployment

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'
  DEPLOY_TIMEOUT: 600
  HEALTH_CHECK_TIMEOUT: 120
  DEPLOYMENT_LOCK_TIMEOUT: 1800
  MAX_RELEASES_TO_KEEP: 5
  
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STAGE 1: PRE-DEPLOYMENT VALIDATION
  # ============================================================================
  
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.validate.outputs.is_valid }}
      version: ${{ steps.version.outputs.version }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      
      - name: Validate branch and source
        id: validate
        run: |
          echo "🔍 Validating deployment request..."
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Ref: ${{ github.ref }}"
          
          if [[ "${{ github.ref }}" != "refs/heads/release" ]] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "❌ Deployment rejected: Not from release branch or version tag"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Deployment validation passed"
          echo "is_valid=true" >> $GITHUB_OUTPUT
      
      - name: Get version and SHA
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"
      
      - name: Get short SHA
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Commit SHA: $SHORT_SHA"
      
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="production"
          fi
          echo "deploy_env=$ENV" >> $GITHUB_OUTPUT
          echo "Deployment environment: $ENV"
      
      - name: Verify production readiness
        run: |
          echo "🔍 Verifying production readiness..."
          
          [ -d "dist" ] || { echo "❌ Missing dist/ directory"; exit 1; }
          [ -f "package.json" ] || { echo "❌ Missing package.json"; exit 1; }
          [ -f "ecosystem.config.cjs" ] || [ -f "ecosystem.config.js" ] || { echo "❌ Missing ecosystem config"; exit 1; }
          [ -d "deployment/scripts" ] || { echo "❌ Missing deployment/scripts"; exit 1; }
          
          echo "✅ Required files present"
          
          DEV_ARTIFACTS_FOUND=false
          
          if [ -d "tests/" ]; then
            echo "❌ tests/ directory found in release branch!"
            DEV_ARTIFACTS_FOUND=true
          fi
          
          if [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
            echo "❌ vitest config found in release branch!"
            DEV_ARTIFACTS_FOUND=true
          fi
          
          if [ -f "eslint.config.js" ]; then
            echo "❌ eslint config found in release branch!"
            DEV_ARTIFACTS_FOUND=true
          fi
          
          TEST_FILES=$(find . -name "*.test.*" -o -name "*.spec.*" 2>/dev/null | wc -l)
          if [ "$TEST_FILES" -gt 0 ]; then
            echo "❌ Found $TEST_FILES test files in release branch!"
            DEV_ARTIFACTS_FOUND=true
          fi
          
          if [ "$DEV_ARTIFACTS_FOUND" = true ]; then
            echo "❌ CRITICAL: Dev artifacts detected in release branch!"
            echo "Release branch must contain ONLY production-ready code."
            exit 1
          fi
          
          echo "✅ No dev artifacts found - production ready"

  # ============================================================================
  # STAGE 2: CREATE DEPLOYMENT RECORD
  # ============================================================================
  
  create-deployment:
    name: Create Deployment Record
    runs-on: ubuntu-latest
    needs: validate-deployment
    if: needs.validate-deployment.outputs.is_valid == 'true'
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    
    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ needs.validate-deployment.outputs.deploy_env }}
          ref: ${{ github.ref }}
          description: "Deploying v${{ needs.validate-deployment.outputs.version }}"
      
      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`v${{ needs.validate-deployment.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate-deployment.outputs.deploy_env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ needs.validate-deployment.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Started:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment ID:** ${{ steps.deployment.outputs.deployment_id }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 3: DEPLOY TO VPS (Zero-Downtime with Atomic Releases)
  # ============================================================================
  
  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [validate-deployment, create-deployment]
    environment: 
      name: ${{ needs.validate-deployment.outputs.deploy_env }}
      url: https://${{ secrets.VPS_HOSTNAME }}
    timeout-minutes: 10
    outputs:
      release_dir: ${{ steps.deploy.outputs.release_dir }}
      previous_release: ${{ steps.deploy.outputs.previous_release }}
    
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Send deployment start notification
        run: |
          VERSION="${{ needs.validate-deployment.outputs.version }}"
          SHORT_SHA="${{ needs.validate-deployment.outputs.short_sha }}"
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Deployment Starting\",
                \"description\": \"Initiating zero-downtime deployment to production VPS\",
                \"color\": 3447003,
                \"fields\": [
                  {\"name\": \"Version\", \"value\": \"\`v${VERSION}\`\", \"inline\": true},
                  {\"name\": \"Environment\", \"value\": \"\`${{ needs.validate-deployment.outputs.deploy_env }}\`\", \"inline\": true},
                  {\"name\": \"VPS\", \"value\": \"\`${{ secrets.VPS_HOSTNAME }}\`\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"\`${SHORT_SHA}\`\", \"inline\": true},
                  {\"name\": \"Triggered By\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Estimated Time\", \"value\": \"2-3 minutes\", \"inline\": true},
                  {\"name\": \"Workflow\", \"value\": \"[View Progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || echo "Discord notification failed"
        continue-on-error: true
      
      - name: Resolve VPS hostname
        id: dns
        run: |
          echo "🔍 Resolving VPS hostname..."
          HOSTNAME="${{ secrets.VPS_HOSTNAME }}"
          
          if command -v dig &> /dev/null; then
            IP=$(dig +short "$HOSTNAME" | grep -E '^[0-9.]+$' | head -n1)
          elif command -v nslookup &> /dev/null; then
            IP=$(nslookup "$HOSTNAME" | awk '/^Address: / { print $2 }' | grep -E '^[0-9.]+$' | head -n1)
          else
            IP="$HOSTNAME"
          fi
          
          if [ -z "$IP" ]; then
            echo "❌ Failed to resolve hostname: $HOSTNAME"
            exit 1
          fi
          
          echo "vps_ip=$IP" >> $GITHUB_OUTPUT
          echo "✅ Resolved $HOSTNAME → $IP"
      
      - name: Setup SSH with host verification
        run: |
          echo "🔐 Setting up SSH with host verification..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          SSH_KEY="${{ secrets.VPS_SSH_KEY }}"
          if [ -z "$SSH_KEY" ]; then
            SSH_KEY="${{ secrets.DEPLOY_KEY }}"
          fi
          
          if [ -z "$SSH_KEY" ]; then
            echo "❌ No SSH key found in VPS_SSH_KEY or DEPLOY_KEY secrets"
            exit 1
          fi
          
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          if ! ssh-keygen -l -f ~/.ssh/deploy_key &>/dev/null; then
            echo "❌ Invalid SSH key format"
            exit 1
          fi
          
          echo "✅ SSH key validated"
          
          ssh-keyscan -H "${{ steps.dns.outputs.vps_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H "${{ secrets.VPS_HOSTNAME }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          
          echo "✅ Host keys added (using ssh-keyscan for dynamic hostname)"
      
      - name: Test SSH connection
        timeout-minutes: 2
        run: |
          echo "🔌 Testing SSH connection..."
          if ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'echo "SSH connection successful"'; then
            echo "✅ SSH connection verified"
          else
            echo "❌ SSH connection failed"
            exit 1
          fi
      
      - name: Check VPS disk space
        run: |
          echo "💾 Checking VPS disk space..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'df -h /var/www && echo "✅ Disk space check passed"'
      
      - name: Acquire deployment lock on server
        timeout-minutes: 2
        run: |
          echo "🔒 Acquiring deployment lock on server..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'ENDSSH'
          set -e
          LOCK_FILE="/var/lock/tzbot_deploy.lock"
          
          cleanup_lock() {
            rm -f "$LOCK_FILE"
            echo "🔓 Lock cleanup on exit"
          }
          
          trap cleanup_lock EXIT INT TERM
          
          if [ -f "$LOCK_FILE" ]; then
            LOCK_AGE=$(($(date +%s) - $(stat -c %Y "$LOCK_FILE" 2>/dev/null || stat -f %m "$LOCK_FILE")))
            if [ $LOCK_AGE -lt ${{ env.DEPLOYMENT_LOCK_TIMEOUT }} ]; then
              echo "❌ Deployment lock exists (age: ${LOCK_AGE}s)"
              echo "Another deployment may be in progress"
              exit 1
            else
              echo "⚠️ Stale lock found (age: ${LOCK_AGE}s), removing..."
              rm -f "$LOCK_FILE"
            fi
          fi
          
          echo "${{ github.run_id }}" > "$LOCK_FILE"
          echo "✅ Deployment lock acquired"
          ENDSSH
      
      - name: Setup environment variables on VPS
        timeout-minutes: 2
        run: |
          echo "🔧 Setting up environment variables..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'EOF'
          set -e
          
          ENV_FILE="/var/www/tzbot/shared/.env"
          mkdir -p /var/www/tzbot/shared
          : > "$ENV_FILE"
          
          append_if_set() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              value=$(echo "$value" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
              printf '%s="%s"\n' "$key" "$value" >> "$ENV_FILE"
            fi
          }
          
          echo "# Discord Configuration" >> "$ENV_FILE"
          append_if_set "DISCORD_TOKEN" '${{ secrets.DISCORD_TOKEN }}'
          append_if_set "DISCORD_CLIENT_ID" '${{ secrets.DISCORD_CLIENT_ID }}'
          append_if_set "DISCORD_GUILD_ID" '${{ secrets.DISCORD_GUILD_ID }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Discord Role IDs" >> "$ENV_FILE"
          append_if_set "SUBSCRIBER_ROLE_ID" '${{ secrets.SUBSCRIBER_ROLE_ID }}'
          append_if_set "VIP_ROLE_ID" '${{ secrets.VIP_ROLE_ID }}'
          append_if_set "MODERATOR_ROLE_ID" '${{ secrets.MODERATOR_ROLE_ID }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Discord Channel IDs" >> "$ENV_FILE"
          append_if_set "NOTIFICATION_CHANNEL_ID" '${{ secrets.NOTIFICATION_CHANNEL_ID }}'
          append_if_set "FALLBACK_CHANNEL_ID" '${{ secrets.FALLBACK_CHANNEL_ID }}'
          append_if_set "PRIVATE_ANNOUNCEMENT_CHANNEL_ID" '${{ secrets.PRIVATE_ANNOUNCEMENT_CHANNEL_ID }}'
          append_if_set "PUBLIC_ANNOUNCEMENT_CHANNEL_IDS" '${{ secrets.PUBLIC_ANNOUNCEMENT_CHANNEL_IDS }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Database Configuration" >> "$ENV_FILE"
          append_if_set "DATABASE_URL" '${{ secrets.DATABASE_URL }}'
          append_if_set "DATABASE_MAX_CONNECTIONS" '${{ secrets.DATABASE_MAX_CONNECTIONS }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Redis Configuration" >> "$ENV_FILE"
          append_if_set "REDIS_URL" '${{ secrets.REDIS_URL }}'
          append_if_set "REDIS_PASSWORD" '${{ secrets.REDIS_PASSWORD }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Kick Integration" >> "$ENV_FILE"
          append_if_set "KICK_API_KEY" '${{ secrets.KICK_API_KEY }}'
          append_if_set "KICK_CHANNEL_ID" '${{ secrets.KICK_CHANNEL_ID }}'
          append_if_set "KICK_WEBHOOK_SECRET" '${{ secrets.KICK_WEBHOOK_SECRET }}'
          append_if_set "KICK_OAUTH_CLIENT_ID" '${{ secrets.KICK_OAUTH_CLIENT_ID }}'
          append_if_set "KICK_OAUTH_CLIENT_SECRET" '${{ secrets.KICK_OAUTH_CLIENT_SECRET }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Google Safe Browsing API" >> "$ENV_FILE"
          append_if_set "GOOGLE_SAFE_BROWSING_API_KEY" '${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}'
          
          echo "" >> "$ENV_FILE"
          echo "# Application Settings" >> "$ENV_FILE"
          printf '%s=%s\n' "NODE_ENV" "production" >> "$ENV_FILE"
          printf '%s=%s\n' "LOG_LEVEL" "info" >> "$ENV_FILE"
          
          echo "" >> "$ENV_FILE"
          echo "# Monitoring & Alerts" >> "$ENV_FILE"
          append_if_set "DISCORD_WEBHOOK_URL" '${{ secrets.DISCORD_WEBHOOK_URL }}'
          
          chmod 600 "$ENV_FILE"
          echo "✅ Environment configured (secrets not echoed)"
          EOF
      
      - name: Execute atomic deployment
        id: deploy
        timeout-minutes: 5
        run: |
          echo "📦 Deploying to VPS with zero-downtime strategy..."
          VERSION="${{ needs.validate-deployment.outputs.version }}"
          SHORT_SHA="${{ needs.validate-deployment.outputs.short_sha }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            "bash -s" << ENDSSH
          set -e
          
          DEPLOY_BASE="/var/www/tzbot"
          VERSION="$VERSION"
          SHORT_SHA="$SHORT_SHA"
          TIMESTAMP="$TIMESTAMP"
          RELEASE_NAME="v\${VERSION}-\${SHORT_SHA}-\${TIMESTAMP}"
          RELEASE_DIR="\$DEPLOY_BASE/releases/\$RELEASE_NAME"
          CURRENT_LINK="\$DEPLOY_BASE/current"
          
          echo "📁 Creating versioned release directory: \$RELEASE_DIR"
          mkdir -p "\$RELEASE_DIR"
          mkdir -p "\$DEPLOY_BASE/releases"
          mkdir -p "\$DEPLOY_BASE/shared"
          
          PREVIOUS_RELEASE=""
          if [ -L "\$CURRENT_LINK" ]; then
            PREVIOUS_RELEASE=\$(readlink "\$CURRENT_LINK")
            echo "Previous release: \$PREVIOUS_RELEASE"
          fi
          
          cd "\$DEPLOY_BASE"
          
          if [ -d .git ]; then
            echo "📦 Updating git repository..."
            git fetch origin release
            git reset --hard origin/release
          else
            echo "❌ Git repository not found - run initial setup first"
            exit 1
          fi
          
          echo "📦 Copying files to release directory..."
          rsync -a --exclude='.git' --exclude='releases' --exclude='shared' --exclude='current' . "\$RELEASE_DIR/"
          
          cd "\$RELEASE_DIR"
          
          echo "📦 Installing production dependencies..."
          npm ci --production --no-audit --no-fund
          
          echo "🔨 Building application..."
          npm run build
          
          echo "🔗 Linking shared files..."
          ln -sf "\$DEPLOY_BASE/shared/.env" "\$RELEASE_DIR/.env"
          
          if [ -d "\$DEPLOY_BASE/shared/logs" ]; then
            rm -rf "\$RELEASE_DIR/logs"
            ln -sf "\$DEPLOY_BASE/shared/logs" "\$RELEASE_DIR/logs"
          fi
          
          echo "🔄 Atomic symlink switch..."
          ln -sfn "\$RELEASE_DIR" "\$CURRENT_LINK.tmp"
          mv -Tf "\$CURRENT_LINK.tmp" "\$CURRENT_LINK"
          
          echo "✅ Deployment completed, symlink updated to \$RELEASE_NAME"
          
          echo "🧹 Pruning old releases (keeping last ${{ env.MAX_RELEASES_TO_KEEP }})..."
          cd "\$DEPLOY_BASE/releases"
          ls -t | tail -n +$((${{ env.MAX_RELEASES_TO_KEEP }} + 1)) | xargs -r rm -rf
          echo "✅ Old releases pruned"
          
          echo "RELEASE_DIR=\$RELEASE_DIR" >> /tmp/deploy_output.txt
          echo "PREVIOUS_RELEASE=\$PREVIOUS_RELEASE" >> /tmp/deploy_output.txt
          ENDSSH
          
          RELEASE_DIR=$(ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} 'cat /tmp/deploy_output.txt | grep RELEASE_DIR | cut -d= -f2')
          PREVIOUS_RELEASE=$(ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} 'cat /tmp/deploy_output.txt | grep PREVIOUS_RELEASE | cut -d= -f2')
          
          echo "release_dir=$RELEASE_DIR" >> $GITHUB_OUTPUT
          echo "previous_release=$PREVIOUS_RELEASE" >> $GITHUB_OUTPUT
      
      - name: Install/Update VPS runtime monitoring
        timeout-minutes: 2
        run: |
          echo "📊 Installing VPS runtime monitoring..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'ENDSSH'
          set -e
          
          NOTIFIER_SCRIPT="/usr/local/bin/tzbot-webhook-alert.sh"
          
          cat > "$NOTIFIER_SCRIPT" << 'NOTIFIER_EOF'
#!/bin/bash
set -e

SERVICE_NAME="${1:-tzbot}"
ERROR_TYPE="${2:-crash}"
LOG_LINES="${3:-50}"

ENV_FILE="/var/www/tzbot/shared/.env"
if [ ! -f "$ENV_FILE" ]; then
  echo "Error: .env file not found at $ENV_FILE"
  exit 1
fi

source "$ENV_FILE"

if [ -z "$DISCORD_WEBHOOK_URL" ]; then
  echo "Error: DISCORD_WEBHOOK_URL not set in .env"
  exit 1
fi

HOSTNAME=$(hostname)
TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

VERSION="unknown"
if [ -L "/var/www/tzbot/current" ]; then
  CURRENT_RELEASE=$(readlink /var/www/tzbot/current)
  VERSION=$(basename "$CURRENT_RELEASE")
fi

LOG_OUTPUT=""
if [ -f "/var/www/tzbot/current/logs/error.log" ]; then
  LOG_OUTPUT=$(tail -n "$LOG_LINES" /var/www/tzbot/current/logs/error.log | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
fi

if [ -z "$LOG_OUTPUT" ]; then
  LOG_OUTPUT="No recent error logs available"
fi

PM2_STATUS="unknown"
if command -v pm2 &> /dev/null; then
  PM2_STATUS=$(pm2 jlist 2>/dev/null | jq -r ".[] | select(.name==\"$SERVICE_NAME\") | .pm2_env.status" 2>/dev/null || echo "unknown")
fi

curl -H "Content-Type: application/json" -X POST \
  -d "{
    \"embeds\": [{
      \"title\": \"🚨 Service Alert: $ERROR_TYPE\",
      \"description\": \"Service **$SERVICE_NAME** on **$HOSTNAME** has encountered an issue.\",
      \"color\": 15158332,
      \"fields\": [
        {\"name\": \"Service\", \"value\": \"\`$SERVICE_NAME\`\", \"inline\": true},
        {\"name\": \"Hostname\", \"value\": \"\`$HOSTNAME\`\", \"inline\": true},
        {\"name\": \"Error Type\", \"value\": \"\`$ERROR_TYPE\`\", \"inline\": true},
        {\"name\": \"PM2 Status\", \"value\": \"\`$PM2_STATUS\`\", \"inline\": true},
        {\"name\": \"Version\", \"value\": \"\`$VERSION\`\", \"inline\": true},
        {\"name\": \"Timestamp\", \"value\": \"\`$TIMESTAMP\`\", \"inline\": true},
        {\"name\": \"Recent Logs\", \"value\": \"\`\`\`\\n${LOG_OUTPUT:0:1000}\\n\`\`\`\", \"inline\": false}
      ],
      \"timestamp\": \"$TIMESTAMP\"
    }]
  }" \
  "$DISCORD_WEBHOOK_URL" || echo "Failed to send Discord alert"

echo "Alert sent to Discord webhook"
NOTIFIER_EOF
          
          chmod +x "$NOTIFIER_SCRIPT"
          echo "✅ Runtime monitoring script installed at $NOTIFIER_SCRIPT"
          
          if command -v pm2 &> /dev/null; then
            echo "Setting up PM2 event hooks..."
            pm2 install pm2-logrotate || true
          fi
          
          echo "✅ VPS monitoring configured"
          ENDSSH
        continue-on-error: true
      
      - name: Restart application with PM2
        timeout-minutes: 2
        run: |
          echo "🔄 Restarting application with PM2..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'ENDSSH'
          set -e
          cd /var/www/tzbot/current
          
          if pm2 describe tzbot > /dev/null 2>&1; then
            echo "Reloading PM2 process (zero-downtime)..."
            pm2 reload ecosystem.config.cjs --update-env
          else
            echo "Starting PM2 process..."
            pm2 start ecosystem.config.cjs
          fi
          
          pm2 save
          echo "✅ Application restarted"
          ENDSSH
      
      - name: Wait for application startup
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 15
          echo "✅ Startup wait completed"
      
      - name: Run health checks with retries and exponential backoff
        id: health
        timeout-minutes: 3
        run: |
          echo "🏥 Running health checks with retries..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'ENDSSH'
          set -e
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          DELAY=3
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if pm2 describe tzbot > /dev/null 2>&1; then
              STATUS=$(pm2 jlist | jq -r '.[] | select(.name=="tzbot") | .pm2_env.status')
              RESTARTS=$(pm2 jlist | jq -r '.[] | select(.name=="tzbot") | .pm2_env.restart_time')
              
              if [ "$STATUS" = "online" ]; then
                echo "✅ PM2 process is online"
                echo "Restart count: $RESTARTS"
                
                if [ "$RESTARTS" -lt 3 ]; then
                  echo "✅ Health check passed"
                  exit 0
                else
                  echo "⚠️ High restart count: $RESTARTS"
                fi
              else
                echo "⚠️ PM2 process status: $STATUS"
              fi
            else
              echo "⚠️ PM2 process not found"
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Waiting ${DELAY}s before retry (exponential backoff)..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Health checks failed after $MAX_ATTEMPTS attempts"
          exit 1
          ENDSSH
          
          echo "health_status=passed" >> $GITHUB_OUTPUT
      
      - name: Release deployment lock on server
        if: always()
        run: |
          echo "🔓 Releasing deployment lock on server..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'rm -f /var/lock/tzbot_deploy.lock && echo "✅ Lock released"' || true
        continue-on-error: true
      
      - name: Upload deployment logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.run_id }}
          path: |
            ~/.ssh/known_hosts
          retention-days: 30
        continue-on-error: true
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "✅ SSH key cleaned up"

  # ============================================================================
  # STAGE 4: POST-DEPLOYMENT VERIFICATION
  # ============================================================================
  
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [validate-deployment, create-deployment, deploy-to-vps]
    if: success()
    
    steps:
      - name: Update deployment status
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          state: success
          environment-url: https://${{ secrets.VPS_HOSTNAME }}
      
      - name: Send success notification
        run: |
          VERSION="${{ needs.validate-deployment.outputs.version }}"
          SHORT_SHA="${{ needs.validate-deployment.outputs.short_sha }}"
          RELEASE_DIR="${{ needs.deploy-to-vps.outputs.release_dir }}"
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ Deployment Successful\",
                \"description\": \"Zero-downtime deployment completed successfully. All systems operational.\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Version\", \"value\": \"\`v${VERSION}\`\", \"inline\": true},
                  {\"name\": \"Environment\", \"value\": \"\`${{ needs.validate-deployment.outputs.deploy_env }}\`\", \"inline\": true},
                  {\"name\": \"VPS\", \"value\": \"\`${{ secrets.VPS_HOSTNAME }}\`\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"\`${SHORT_SHA}\`\", \"inline\": true},
                  {\"name\": \"Deployed By\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Health Status\", \"value\": \"🟢 All checks passed\", \"inline\": true},
                  {\"name\": \"Release Directory\", \"value\": \"\`${RELEASE_DIR}\`\", \"inline\": false},
                  {\"name\": \"Workflow\", \"value\": \"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || echo "Discord notification failed"
        continue-on-error: true
      
      - name: Create deployment summary
        run: |
          VERSION="${{ needs.validate-deployment.outputs.version }}"
          SHORT_SHA="${{ needs.validate-deployment.outputs.short_sha }}"
          
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`v$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate-deployment.outputs.deploy_env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "🟢 All health checks passed" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Application running normally" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Zero-downtime deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Runtime monitoring active" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 5: AUTOMATIC ROLLBACK ON FAILURE
  # ============================================================================
  
  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [validate-deployment, create-deployment, deploy-to-vps]
    if: failure()
    
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Resolve VPS hostname
        id: dns
        run: |
          HOSTNAME="${{ secrets.VPS_HOSTNAME }}"
          if command -v dig &> /dev/null; then
            IP=$(dig +short "$HOSTNAME" | grep -E '^[0-9.]+$' | head -n1)
          else
            IP="$HOSTNAME"
          fi
          echo "vps_ip=$IP" >> $GITHUB_OUTPUT
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          SSH_KEY="${{ secrets.VPS_SSH_KEY }}"
          if [ -z "$SSH_KEY" ]; then
            SSH_KEY="${{ secrets.DEPLOY_KEY }}"
          fi
          
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H "${{ steps.dns.outputs.vps_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H "${{ secrets.VPS_HOSTNAME }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
      
      - name: Execute rollback to previous version
        timeout-minutes: 3
        run: |
          echo "🔄 Initiating automatic rollback to previous version..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'bash -s' << 'ENDSSH'
          set -e
          
          DEPLOY_BASE="/var/www/tzbot"
          CURRENT_LINK="$DEPLOY_BASE/current"
          RELEASES_DIR="$DEPLOY_BASE/releases"
          
          CURRENT_RELEASE=$(readlink "$CURRENT_LINK" 2>/dev/null || echo "")
          if [ -z "$CURRENT_RELEASE" ]; then
            echo "❌ No current release found"
            exit 1
          fi
          
          CURRENT_NAME=$(basename "$CURRENT_RELEASE")
          echo "Current release: $CURRENT_NAME"
          
          PREVIOUS_RELEASE=""
          for release in $(ls -t "$RELEASES_DIR"); do
            if [ "$release" != "$CURRENT_NAME" ]; then
              PREVIOUS_RELEASE="$RELEASES_DIR/$release"
              break
            fi
          done
          
          if [ -z "$PREVIOUS_RELEASE" ] || [ ! -d "$PREVIOUS_RELEASE" ]; then
            echo "❌ No previous release found for rollback"
            exit 1
          fi
          
          echo "Rolling back to: $(basename $PREVIOUS_RELEASE)"
          
          echo "🔄 Stopping PM2 service..."
          pm2 stop tzbot || true
          
          echo "🔗 Switching symlink to previous release..."
          ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK.tmp"
          mv -Tf "$CURRENT_LINK.tmp" "$CURRENT_LINK"
          
          echo "🔄 Starting PM2 service..."
          cd "$CURRENT_LINK"
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save
          
          echo "✅ Rollback completed successfully"
          
          sleep 10
          
          echo "🏥 Verifying rollback health..."
          if pm2 describe tzbot > /dev/null 2>&1; then
            STATUS=$(pm2 jlist | jq -r '.[] | select(.name=="tzbot") | .pm2_env.status')
            if [ "$STATUS" = "online" ]; then
              echo "✅ Rollback health check passed"
            else
              echo "❌ Rollback health check failed: status=$STATUS"
              /usr/local/bin/tzbot-webhook-alert.sh tzbot "rollback-failed" 100 || true
              exit 1
            fi
          else
            echo "❌ PM2 process not found after rollback"
            exit 1
          fi
          ENDSSH
          
          echo "✅ Rollback completed and verified"
      
      - name: Release deployment lock on server
        if: always()
        run: |
          echo "🔓 Releasing deployment lock on server..."
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_USER }}@${{ steps.dns.outputs.vps_ip }} \
            'rm -f /var/lock/tzbot_deploy.lock && echo "✅ Lock released"' || true
        continue-on-error: true
      
      - name: Update deployment status
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          state: failure
          description: "Deployment failed, rolled back to previous version"
      
      - name: Send failure notification
        run: |
          VERSION="${{ needs.validate-deployment.outputs.version }}"
          SHORT_SHA="${{ needs.validate-deployment.outputs.short_sha }}"
          
          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ Deployment Failed - Automatic Rollback\",
                \"description\": \"Deployment failed and automatic rollback was triggered. Previous stable version has been restored.\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"Failed Version\", \"value\": \"\`v${VERSION}\`\", \"inline\": true},
                  {\"name\": \"Environment\", \"value\": \"\`${{ needs.validate-deployment.outputs.deploy_env }}\`\", \"inline\": true},
                  {\"name\": \"VPS\", \"value\": \"\`${{ secrets.VPS_HOSTNAME }}\`\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"\`${SHORT_SHA}\`\", \"inline\": true},
                  {\"name\": \"Status\", \"value\": \"🔴 Rolled back\", \"inline\": true},
                  {\"name\": \"Service Status\", \"value\": \"🟢 Operational (previous version)\", \"inline\": true},
                  {\"name\": \"Action Required\", \"value\": \"Review logs and fix issues before redeploying\", \"inline\": false},
                  {\"name\": \"Workflow\", \"value\": \"[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || echo "Discord notification failed"
        continue-on-error: true
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
      
      - name: Create failure summary
        run: |
          VERSION="${{ needs.validate-deployment.outputs.version }}"
          SHORT_SHA="${{ needs.validate-deployment.outputs.short_sha }}"
          
          echo "## ❌ Deployment Failed - Automatic Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`v$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate-deployment.outputs.deploy_env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Actions Taken" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Automatic rollback to previous version" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Previous stable version restored" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Service is operational" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review deployment logs in the workflow" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix issues in development branch" >> $GITHUB_STEP_SUMMARY
          echo "3. Re-run CI/CD pipeline after fixes" >> $GITHUB_STEP_SUMMARY
          echo "4. Monitor application health" >> $GITHUB_STEP_SUMMARY
